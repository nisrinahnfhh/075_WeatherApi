<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API - Pencarian Lokasi</title>
        <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            background-size: 300% 300%;
            animation: bg 12s ease infinite;
            padding: 20px;
        }
        @keyframes bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 24px;
            padding: 28px;
            color: #fff;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header .title { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: .85; }
        .header h3 { margin-top: 10px; font-size: 18px; }
        .header p { font-size: 14px; opacity: .85; }
        hr { border: none; height: 1px; background: rgba(255,255,255,.4); margin: 16px 0; }

        .search { display: flex; gap: 8px; margin-bottom: 18px; }
        .search input {
            flex: 1;
            padding: 12px 14px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }
        .search button {
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            background: #1e1b4b;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s, background .2s;
        }
        .search button:hover { background: #312e81; transform: translateY(-2px); }

        .lokasi-title { text-align: center; margin-bottom: 14px; }
        .lokasi-title small { opacity: .8; }
        .lokasi-title h2 { font-size: 24px; margin-top: 4px; }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            animation: fade .5s ease both;
        }
        .row span:first-child { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
        .row span:last-child { font-weight: 600; text-align: right; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        #status { text-align: center; font-size: 14px; margin-bottom: 10px; min-height: 18px; }
        #hasil { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="title">PWS Weather API</div>
            <h3>Nisrina Hanifah Ramadhani</h3>
            <p>20240140075</p>
        </div>
        <hr>
         <div class="search">
            <input type="text" id="input-lokasi" placeholder="Cari lokasi... (mis. Bandung)">
            <button id="btn-cari">Search</button>
        </div>

        <div id="status"></div>

        <div id="hasil">
            <div class="lokasi-title">
                <small>Lokasi</small>
                <h2 id="lokasi"></h2>
            </div>
            <div class="row"><span>Negara</span><span id="negara"></span></div>
            <div class="row"><span>Provinsi</span><span id="provinsi"></span></div>
            <div class="row"><span>Kecamatan</span><span id="kecamatan"></span></div>
            <div class="row"><span>Longitude</span><span id="longitude"></span></div>
            <div class="row"><span>Latitude</span><span id="latitude"></span></div>
        </div>
    </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        const API_KEY = "RlGrXLDS5niF5gx1M3PE";

        // Ambil negara/provinsi/kecamatan dari feature atau context
        function cariWilayah(feature, tipe) {
            if (feature.place_type && feature.place_type.some(t => tipe.includes(t))) {
                return feature.text;
            }
            if (feature.context) {
                for (const c of feature.context) {
                    const prefix = c.id.split(".")[0];
                    if (tipe.includes(prefix)) return c.text;
                }
            }
            return "-";
        }

        function cari() {
            const kota = $("#input-lokasi").val().trim();
            if (!kota) {
                $("#status").text("Masukkan nama lokasi dulu ya.");
                return;
            }

            $("#status").text("Mencari data...");
            $("#hasil").hide();

            const urlapi = "https://api.maptiler.com/geocoding/" + encodeURIComponent(kota) + ".json?key=" + API_KEY + "&language=id&limit=1";

            $.ajax({
                url: urlapi,
                method: "GET",
                success: function (data) {
                    console.log(data);
                    if (!data.features || data.features.length === 0) {
                        $("#status").text("Lokasi tidak ditemukan.");
                        return;
                    }

                    const f = data.features[0];
                    $("#lokasi").text(f.matching_text || f.text || f.place_name);
                    $("#negara").text(cariWilayah(f, ["country"]));
                    $("#provinsi").text(cariWilayah(f, ["region"]));
                    $("#kecamatan").text(cariWilayah(f, ["municipal_district", "subregion", "locality", "neighbourhood", "municipality"]));
                    $("#longitude").text(f.center[0]);
                    $("#latitude").text(f.center[1]);

                    $("#status").text("");
                    $("#hasil").show();
                },
                error: function (error) {
                    console.log(error);
                    $("#status").text("Gagal mengambil data API.");
                }
            });
        }

        $("#btn-cari").on("click", cari);
        $("#input-lokasi").on("keypress", function (e) {
            if (e.key === "Enter") cari();
        });
    </script>
</body>
</html>
